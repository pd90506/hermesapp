# Linux-only CI for the shared Swift package. macOS runners bill at 10x on
# private repos, so app/UI builds stay on the Mac (see AGENTS.md).
name: package-tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - ".github/workflows/package-tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - ".github/workflows/package-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 6.2 = the compiler in Xcode 26 (catches code that only the newer
        # NUC toolchain accepts); 6.4 = the NUC toolchain.
        swift: ["6.2", "6.4"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --package-path Packages/HermesKit
      - name: Test
        run: swift test --package-path Packages/HermesKit
