# Linux-only CI for the shared Swift package. macOS runners bill at 10x on
# private repos, so app/UI builds stay on the Mac (see AGENTS.md).
name: package-tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - ".github/workflows/package-tests.yml"
      - "scripts/test-package-ci.sh"
  pull_request:
    paths:
      - "Packages/**"
      - ".github/workflows/package-tests.yml"
      - "scripts/test-package-ci.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 6.2 = the compiler in Xcode 26 (catches code that only the newer
        # NUC toolchain accepts); 6.4 = the NUC toolchain.
        swift: ["6.2", "6.4"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v4
      # Tests too, so the Test step's deadline bounds running them, not compiling.
      - name: Build
        run: swift build --package-path Packages/HermesKit --build-tests
      # Cooperative waits fail at their suite time limit; the wrapper also
      # bounds non-cooperative hangs and lists tests missing completion lines.
      - name: Test
        timeout-minutes: 5
        shell: bash
        # Workspace-relative: in a container job `runner.temp` names the host's
        # path, which the upload step (run inside the container) cannot see. Not a
        # dot directory: upload-artifact skips hidden files.
        run: bash scripts/test-package-ci.sh ci-logs/package-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-tests-${{ matrix.swift }}
          path: ci-logs/package-tests.log
          if-no-files-found: ignore
