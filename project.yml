# XcodeGen spec — the single source of truth for the Xcode project.
# Generate on the Mac with `xcodegen generate` (see README). Hermes.xcodeproj
# is generated and git-ignored; edit this file, never the .xcodeproj.
name: Hermes

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  HermesKit:
    path: Packages/HermesKit
  # Native LaTeX rendering for the apps only (MIT). Pinned exactly; see AGENTS.md
  # "Dependencies" before changing. HermesKit itself stays dependency-free.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3

targets:
  HermesMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Shared
      - path: Apps/macOS
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
      - package: SwiftMath
    info:
      path: Config/Generated/HermesMac-Info.plist
      properties:
        CFBundleDisplayName: Hermes
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/Generated/HermesMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The composer's "Choose Image…" panel: read the images the user picks.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Hermes
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).mac
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}

  # AppKit tests of the composer's text view and clipboard handling, with synthetic
  # NSPasteboards. Not hosted in the app (which connects on launch): it compiles the
  # two files it tests. Run: xcodebuild test -scheme HermesMacTests -destination platform=macOS
  HermesMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Tests/macOS
      - path: Apps/Shared/Composer/ComposerTextView.swift
      - path: Apps/Shared/Composer/ImageLoader.swift
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - HermesMacTests

  HermesiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Shared
      - path: Apps/iOS
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
      - package: SwiftMath
    info:
      path: Config/Generated/HermesiOS-Info.plist
      properties:
        CFBundleDisplayName: Hermes
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Hermes connects to your self-hosted Hermes gateway on your local network or tailnet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Hermes
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}
