# XcodeGen spec — the single source of truth for the Xcode project.
# Generate on the Mac with `xcodegen generate` (see README). Hermes.xcodeproj
# is generated and git-ignored; edit this file, never the .xcodeproj.
name: Hermes

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  HermesKit:
    path: Packages/HermesKit
  # Native LaTeX rendering for the apps only (MIT). Pinned exactly; see AGENTS.md
  # "Dependencies" before changing. HermesKit itself stays dependency-free.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3

targets:
  HermesMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Shared
      - path: Apps/macOS
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
      - package: SwiftMath
    info:
      path: Config/Generated/HermesMac-Info.plist
      properties:
        CFBundleDisplayName: Hermes
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/Generated/HermesMac.entitlements
      properties:
        # Not sandboxed (decided by the user, 2026-10): the app runs `hermes serve` on this
        # Mac ("This Mac"), which must read ~/.hermes, as Hermes Desktop does. A sandboxed
        # app's child process inherits the sandbox. A Mac App Store build would need it back.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Hermes
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).mac
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # AppKit tests of the composer's text view and clipboard handling, with synthetic
  # NSPasteboards, of the sidebar controls' pointer hover, and of message
  # selection, rendering and copy, in a window. Not hosted in the app (which
  # connects on launch): it compiles the files it tests, and links SwiftMath itself.
  # Run: xcodebuild test -scheme HermesMacTests -destination platform=macOS
  HermesMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Tests/macOS
      - path: Apps/Shared/Composer/ComposerTextView.swift
      - path: Apps/Shared/Composer/ImageLoader.swift
      - path: Apps/Shared/Composer/SlashSuggestionList.swift
      - path: Apps/Shared/Views/Hover.swift
      - path: Apps/Shared/Views/SidebarControls.swift
      - path: Apps/Shared/Views/SheetOutsideClick.swift
      - path: Apps/Shared/Views/MessageCopyButton.swift
      - path: Apps/Shared/Views/MessageRowContent.swift
      - path: Apps/Shared/Views/ScrollLatching.swift
      - path: Apps/Shared/Views/PromptRail.swift
      - path: Apps/Shared/Views/TextSizes.swift
      - path: Apps/Shared/Views/Markdown
      - path: Apps/macOS/WindowFrameAutosave.swift
    dependencies:
      - package: SwiftMath
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - HermesMacTests

  # Live UI tests: the real app against a real dashboard (Apps/UITests).
  # Run: scripts/live-test.sh --ui
  HermesMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/UITests
    dependencies:
      - target: HermesMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesMac
    scheme:
      testTargets:
        - HermesMacUITests

  HermesiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Shared
      - path: Apps/iOS
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: HermesProtocol
      - package: SwiftMath
    info:
      path: Config/Generated/HermesiOS-Info.plist
      properties:
        CFBundleDisplayName: Hermes
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Hermes connects to your self-hosted Hermes gateway on your local network or tailnet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Hermes
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  HermesiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/UITests
    dependencies:
      - target: HermesiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID_PREFIX).ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesiOS
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - HermesiOSUITests
